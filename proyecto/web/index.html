<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastosEmp - Inicio de Sesión</title>
    <meta name="description" content="Sistema de Gestión de Gastos Empresariales - Inicia sesión para acceder a tu cuenta">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="assets/css/app.css" rel="stylesheet">
    <!-- Evitar flash aplicando tema antes del primer render -->
    <script>
        (function(){
            var t = localStorage.getItem('gastos_theme');
            if(t==='light') document.documentElement.setAttribute('data-theme','light');
        })();
    </script>
</head>
<body class="login-page">

    <!-- Botón de tema (esquina superior derecha) -->
    <button class="login-theme-btn" data-theme-toggle title="Cambiar tema">
        <i class="bi bi-sun-fill" id="login-theme-icon"></i>
    </button>

    <div class="login-card">
        <!-- Logo -->
        <div class="login-logo">
            <div class="logo-icon">
                <i class="bi bi-building-check"></i>
            </div>
            <h1>Sistema de Gestión de Gastos</h1>
            <p>Inicio de sesión corporativo</p>
        </div>

        <!-- Form -->
        <form id="login-form" class="login-form" novalidate>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" class="form-control" id="correo" name="correo"
                           placeholder="usuario@empresa.com" required autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="input-group-text password-toggle" id="toggle-password"
                            title="Mostrar/ocultar contraseña">
                        <i class="bi bi-eye" id="toggle-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Error message -->
            <div id="login-error" class="alert alert-danger mb-3" style="display:none;" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span id="login-error-msg"></span>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary w-100 py-2" id="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Ingresar
            </button>
        </form>

        <!-- Version footer -->
        <div class="login-version">
            <p>GastosEmp v1.0.0 &nbsp;&bull;&nbsp; &copy; 2024 Todos los derechos reservados</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
    $(function () {
        // Si ya está autenticado, redirigir al dashboard
        if (Auth.getUser()) {
            window.location.href = 'dashboard.html';
            return;
        }

        // Toggle visibilidad de contraseña
        $('#toggle-password').on('click', function () {
            const input = $('#password');
            const icon = $('#toggle-icon');
            if (input.attr('type') === 'password') {
                input.attr('type', 'text');
                icon.removeClass('bi-eye').addClass('bi-eye-slash');
            } else {
                input.attr('type', 'password');
                icon.removeClass('bi-eye-slash').addClass('bi-eye');
            }
        });

        // Envío del formulario
        $('#login-form').on('submit', function (e) {
            e.preventDefault();

            const correo = $('#correo').val().trim();
            const password = $('#password').val();

            if (!correo || !password) {
                showLoginError('Por favor completa todos los campos.');
                return;
            }

            const $btn = $('#btn-login');
            Utils.setLoading($btn, true, 'Verificando...');
            $('#login-error').hide();

            API.post('/auth/login', { correo, password })
                .then(function (response) {
                    const user = response.data || response.user || response;
                    Auth.setUser(user);
                    window.location.href = 'dashboard.html';
                })
                .catch(function (err) {
                    Utils.setLoading($btn, false);
                    showLoginError(err.message || 'Correo o contraseña incorrectos.');
                });
        });

        function showLoginError(msg) {
            $('#login-error-msg').text(msg);
            $('#login-error').slideDown(200);
        }
    });
    </script>
</body>
</html>
